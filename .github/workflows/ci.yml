name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "cms/**"

permissions:
  contents: read

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.5.0 --activate

      - name: Fetch current main for CMS scope check
        if: startsWith(github.head_ref, 'cms/') || startsWith(github.ref_name, 'cms/')
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Check CMS changed paths against exact head
        if: startsWith(github.head_ref, 'cms/') || startsWith(github.ref_name, 'cms/')
        env:
          CMS_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/check-cms-changes.mjs --base-ref origin/main --head "$CMS_HEAD_SHA"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test CMS safeguards
        run: pnpm test:cms

      - name: Test built-output safeguards
        run: pnpm test:built-site

      - name: Run shared deployment verification
        run: pnpm verify:deploy

      - name: Test Worker
        run: pnpm test:worker

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end smoke tests
        run: pnpm test:e2e
